name: Sincronizar pagamentos Evolia

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar pagamentos pendentes
        env:
          EVOLIA_CRON_TOKEN: ${{ secrets.EVOLIA_CRON_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $EVOLIA_CRON_TOKEN" \
            https://money-ai-k8eb.onrender.com/pagamentos/sincronizar-pendentes
