name: Evolia autonomous cycle
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run autonomous cycle
        env:
          EVOLIA_URL: ${{ secrets.EVOLIA_URL }}
          EVOLIA_CRON_TOKEN: ${{ secrets.EVOLIA_CRON_TOKEN }}
        run: |
          set -e
          test -n "$EVOLIA_URL"
          test -n "$EVOLIA_CRON_TOKEN"
          HTTP_CODE=$(curl -sS --max-time 120 -o /tmp/evolia-response.txt -w "%{http_code}" -X POST "$EVOLIA_URL/ciclo-autonomo" \
            -H "Authorization: Bearer $EVOLIA_CRON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"localizacao":"Brasil"}")
          echo "HTTP $HTTP_CODE"
          echo "Resposta da EVOLIA:"
          cat /tmp/evolia-response.txt
          case "$HTTP_CODE" in
            2*) ;;
            *) exit 22 ;;
          esac
