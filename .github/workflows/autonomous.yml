name: Evolia autonomous cycle
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Run autonomous cycle
        env:
          EVOLIA_URL: ${{ secrets.EVOLIA_URL }}
          EVOLIA_CRON_TOKEN: ${{ secrets.EVOLIA_CRON_TOKEN }}
        run: |
          set -e
          test -n "$EVOLIA_URL"
          test -n "$EVOLIA_CRON_TOKEN"
          curl --fail-with-body --max-time 120 -X POST "$EVOLIA_URL/ciclo-autonomo" \
            -H "Authorization: Bearer $EVOLIA_CRON_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"localizacao":"Brasil"}'
